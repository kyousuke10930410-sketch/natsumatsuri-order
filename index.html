<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夏祭り 前売り注文フォーム｜移転のお知らせ</title>

<!-- ═══════════════════════════════════════════════════════
     転送先の新しいフォームURL。
     GitHubのユーザー名を変えた場合は、ここも書き換えること。
     ※最後のスラッシュ(/)まで必要です
     ═══════════════════════════════════════════════════════ -->
<script>
  var NEW_URL = "https://daihachi-hogoshakai.github.io/natsumatsuri-order/";
</script>

<!-- ─────────────────────────────────────────────────────
     このページは何か（次の人へ）

     受付フォームは保護者会名義のGitHubアカウントへ引っ越しました。
     GitHubは引っ越し前のアドレスを自動で転送してくれないため、
     すでに配ったQRコードを読んだ人が迷子にならないよう、
     元の場所に「転送だけするページ」を置いてあります。

     このページ自体は牛丸個人アカウントにあります。
     個人アカウントが無くなると、この転送も止まります。
     （そのときは、新しいURLのQRだけが有効になります。フォーム本体は無事です）
     ───────────────────────────────────────────────────── -->

<style>
  :root{
    --bg:#FBF3E4; --surface:#FFFFFF; --ink:#28323D; --ink-soft:#6B6457;
    --line:#E8DCC4; --red:#D8472E; --red-deep:#B53A24; --gold:#E8A23D;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 18px;
  }
  .box{
    background:var(--surface); border-radius:16px; padding:32px 24px;
    max-width:420px; width:100%; text-align:center;
    box-shadow:0 4px 18px rgba(40,50,61,.08);
  }
  .lantern{
    width:34px; height:42px; margin:0 auto 16px;
    background:radial-gradient(circle at 50% 40%, var(--gold) 0%, var(--red) 75%);
    border-radius:50% 50% 45% 45%; position:relative;
  }
  .lantern::before,.lantern::after{
    content:''; position:absolute; background:var(--red-deep);
    left:50%; transform:translateX(-50%);
  }
  .lantern::before{ top:-4px; width:18px; height:4px; border-radius:2px; }
  .lantern::after{ bottom:-10px; width:2px; height:10px; }
  h1{ font-size:17px; margin:0 0 14px; font-weight:700; }
  p{ font-size:13.5px; line-height:1.85; color:var(--ink-soft); margin:0 0 18px; }
  .btn{
    display:inline-block; background:var(--red); color:#fff;
    text-decoration:none; border-radius:999px;
    padding:14px 28px; font-size:15px; font-weight:700;
  }
  .small{ font-size:11.5px; margin:18px 0 0; }
</style>
</head>
<body>

<div class="box">
  <div class="lantern"></div>
  <h1>注文フォームは新しいページに移りました</h1>
  <p>
    数秒で自動的に移動します。<br>
    切り替わらない場合は、下のボタンを押してください。
  </p>
  <a class="btn" id="goBtn" href="#">新しいフォームを開く</a>
  <p class="small">
    お手元のQRコードは古いものです。<br>
    移動先のページをブックマークしておくと便利です。
  </p>
</div>

<script>
(function(){
  // ボタンのリンク先を設定（自動転送が効かない環境への保険）
  var btn = document.getElementById('goBtn');
  if (btn) btn.href = NEW_URL;

  // 1.2秒後に自動で移動する。
  // すぐに飛ばさず少し見せるのは、「移転した」と分かってもらい、
  // 新しいURLをブックマークし直してもらうため。
  setTimeout(function(){
    // replace を使うと履歴に残らないので、「戻る」でこのページに戻ってこない
    window.location.replace(NEW_URL);
  }, 1200);
})();
</script>

</body>
</html>
